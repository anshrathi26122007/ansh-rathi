<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 5</title>
</head>
<body>
    <center><h2> Student Registration Form</h2></center>
    <hr>
    <form action="./response.html" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter valid email address" required><br><br>

        <label for="Password">Password:</label>
        <input type="password" id="Password" name="Password" placeholder="Enter password" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <label for="course">Course:</label>
        <select id="course" name="course">
            <option value="">..Select a course..</option>
            <option value="cse">Computer Science</option>
            <option value="ece">Electronics</option>
            <option value="mech">Mechanical</option>
            <option value="civil">Civil</option>
        </select><br><br>

        <label for="Contact No.">Contact No.:</label>
        <input type="tel" id="Contact No." name="Contact No." placeholder="Enter Phone Number" required><br><br>
        
        <label for="Address">Address:</label><br><br><textarea id="Address" name="Address" rows="4" cols="50" placeholder="Enter your address"></textarea><br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>
    <hr>
    <center><p>&copy; 2026 Student Registration Portal</p></center>
</body>
</html>
