<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4</title>
</head>
<body>
    <fieldset>
        <legend><h2>Hotel Room Booking Form</h2></legend>
        <form action="./response.html" method="post">
            <label for="name"> Full Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="Phone">Phone:</label>
            <input type="tel" id="Phone" name="Phone"><br><br>

            <label for="DOB">Check-in Date:</label>
            <input type="date" id="DOB" name="DOB"><br><br>

            <label for="DOB">Check-Out Date:</label>
            <input type="date" id="DOB" name="DOB"><br><br>

            <label for="Room Type">Room Type:</label>
            <select id="Room Type" name="Room Type">
                <option value=""> Single room</option>
                <option value="single">Single</option>
                <option value="double">Double</option>
                <option value="suite">Suite</option>
            </select><br><br>

            <label for="guests">Number of Guests:</label>
            <input type="number" id="guests" name="guests" min="1" max="10"><br><br>
            
            <label for="requests">Special Requests:</label><br>
            <textarea id="requests" name="requests" rows="4" cols="50"></textarea><br><br>

            <input type="submit" value="Book Now">
            <input type="reset" value="Reset Form">
            
        </form>
    </fieldset>
</body>
</html>
